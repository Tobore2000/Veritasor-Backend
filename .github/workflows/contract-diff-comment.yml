name: Report Pact contract diff

on:
  workflow_run:
    workflows: [Pact contract diff]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  report:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted diff code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Fetch pull request commit
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
        run: git fetch --no-tags origin "$HEAD_SHA" "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Download head Pact
        uses: actions/download-artifact@v4
        with:
          name: pact-head-${{ github.event.workflow_run.pull_requests[0].number }}
          path: .contract-diff
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create report
        id: diff
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
        run: |
          git show "origin/$BASE_REF:tests/pacts/Veritasor-Frontend-Veritasor-Backend.json" > .contract-diff/base-pact.json
          npx tsx scripts/pact-diff.ts \
            --base .contract-diff/base-pact.json \
            --head .contract-diff/Veritasor-Frontend-Veritasor-Backend.json \
            --output .contract-diff/report.md

      - name: Post or update PR comment
        if: always() && steps.diff.outcome == 'success'
        uses: actions/github-script@v7
        env:
          REPORT_PATH: .contract-diff/report.md
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const issue_number = Number(process.env.PR_NUMBER);
            const marker = '<!-- pact-diff-report -->';
            const comments = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number });
            const existing = comments.data.find((comment) => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
            }

      - name: Enforce breaking-change label
        if: always() && steps.diff.outcome == 'success'
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPORT_PATH: .contract-diff/report.md
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q 'Breaking changes detected' "$REPORT_PATH"; then
            labels=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join("\n")')
            echo "$labels" | grep -qx 'breaking-change' || {
              echo 'Breaking contract changes require the breaking-change label.'
              exit 1
            }
          fi
